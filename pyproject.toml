[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Madhumitha", email = "madhumithabaskaran10@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
